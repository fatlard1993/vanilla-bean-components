# The shared CI for a VBC app: copy to .github/workflows/ci.yml. It runs the same gates as githooks/pre-push, for
# pushes that skipped it. Drop the lld steps in an app with no .lld.md documents.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: checkout persists it into .git/config, and the next steps run the branch's own scripts
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # bun test exits nonzero with nothing to run, as the pre-push hook knows
      - run: git ls-files | grep -q '\.test\.js$' && bun test || echo 'no tests'
      - run: bun run lld:lint
      - run: bun run lld
      - run: bun run build
      # Checked, not fixed: build formats the checkout, so what it changed is what the push left unformatted
      - run: git diff --exit-code
